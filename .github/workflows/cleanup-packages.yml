name: Limpieza de versiones

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sin borrar'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Inventario actual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /user/packages/container/node-runtime-base/versions \
            --jq '.[] | "\(.created_at)  \(.metadata.container.tags | join(", ") // "(sin tags)")"'

      - name: Podar
        if: inputs.dry_run != true
        uses: actions/delete-package-versions@v5
        with:
          package-name: node-runtime-base
          package-type: container
          min-versions-to-keep: 20
          # Protege tags SemVer, latest, y los referrers de attestations.
          ignore-versions: '^(latest|\d+|\d+\.\d+|\d+\.\d+\.\d+|sha256-.*)$'