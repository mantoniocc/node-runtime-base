name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publicar en GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # token OIDC para el certificado Sigstore
      attestations: write   # persistir la attestation 
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar el tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' no es SemVer válido."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # QEMU permite construir arm64 en un runner amd64 por emulación.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deriva tags y labels OCI a partir del evento.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
          labels: |
            org.opencontainers.image.title=node-runtime-base
            org.opencontainers.image.description=Imagen base de Node.js 24 hardenizada para la plataforma
            org.opencontainers.image.vendor=mantoniocc
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=docker.io/library/node:24-bookworm-slim

      # PASO 1 — Build de una sola plataforma para poder EJECUTAR y verificar.
      # load: true no soporta múltiples plataformas: la imagen tendría que
      # ser una manifest list y el daemon local solo acepta una arquitectura.
      - name: Build para verificación (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: verify-target:local
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar contrato
        run: ./scripts/verify-image.sh verify-target:local

      # PASO 2 — Build multi-arch y push. La cache de gha hace que amd64
      # se reutilice del paso anterior; solo se construye arm64.
      - name: Build multi-arch y push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generar SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{env.IMAGE}}@${{steps.push.outputs.digest}}
          format: spdx-json
          output-file: sbom.spdx.json
          # No adjuntar al Release: lo distribuiremos como attestation.
          upload-artifact: false

      - name: Attestation de SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{env.IMAGE}}
          subject-digest: ${{steps.push.outputs.digest}}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom.spdx.json
          push-to-registry: true

      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{env.IMAGE}}
          subject-digest: ${{steps.push.outputs.digest}}
          # Escribe la attestation en el propio registry, junto a la imagen.
          push-to-registry: true
          
      - name: Resumen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Publicado"
            echo ""
            echo "**Digest:** \`$DIGEST\`"
            echo ""
            echo "**Plataformas:** linux/amd64, linux/arm64"
            echo ""
            echo "**Tags:**"
            echo "$TAGS" | sed 's/^/- `/;s/$/`/'
            echo ""
            echo "### Referencia inmutable recomendada"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"